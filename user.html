<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>E-SPORTS BD — Player</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{
    --navy:#070b1c; --navy2:#0d1330; --cyan:#00e5ff; --yellow:#ffd60a;
    --purple:#a855f7; --green:#22ff88; --red:#ff3b5c;
  }
  *{font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
  h1,h2,h3,.font-game{font-family:'Orbitron',sans-serif;letter-spacing:.5px;}
  body{background:
    radial-gradient(1200px 600px at 10% -10%, rgba(168,85,247,.18), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, rgba(0,229,255,.15), transparent 60%),
    var(--navy); color:#e7ecff; min-height:100vh; overflow-x:hidden;}
  .glass{background:rgba(20,28,60,.55); backdrop-filter:blur(14px); border:1px solid rgba(120,160,255,.15);}
  .glow-cyan{box-shadow:0 0 20px rgba(0,229,255,.35), inset 0 0 12px rgba(0,229,255,.08);}
  .glow-yellow{box-shadow:0 0 18px rgba(255,214,10,.35);}
  .glow-purple{box-shadow:0 0 20px rgba(168,85,247,.35);}
  .glow-green{box-shadow:0 0 18px rgba(34,255,136,.35);}
  .glow-red{box-shadow:0 0 18px rgba(255,59,92,.35);}
  .neon-text{text-shadow:0 0 8px currentColor, 0 0 18px currentColor;}
  .card{border-radius:18px;}
  .btn{border-radius:12px; font-weight:700; transition:.2s;}
  .btn:active{transform:scale(.97);}
  .input{background:rgba(255,255,255,.05); border:1px solid rgba(120,160,255,.2); border-radius:12px; padding:12px 14px; width:100%; color:#fff; outline:none;}
  .input:focus{border-color:var(--cyan); box-shadow:0 0 0 3px rgba(0,229,255,.15);}
  .chip{display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:600;}
  .tab-active{background:linear-gradient(90deg,var(--cyan),var(--purple)); color:#000; box-shadow:0 0 16px rgba(0,229,255,.5);}
  .bottom-nav{position:fixed; bottom:0; left:0; right:0; z-index:40; backdrop-filter:blur(20px); background:rgba(7,11,28,.9); border-top:1px solid rgba(120,160,255,.15);}
  .bottom-nav a{flex:1; display:flex; flex-direction:column; align-items:center; padding:10px 0; font-size:10px; color:#8ea0cc; transition:.2s;}
  .bottom-nav a.active{color:var(--cyan); text-shadow:0 0 10px var(--cyan);}
  .bottom-nav a svg{width:22px; height:22px; margin-bottom:2px;}
  .scroll-x{display:flex; overflow-x:auto; gap:10px; scrollbar-width:none;}
  .scroll-x::-webkit-scrollbar{display:none;}
  @keyframes slideIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  .page{animation:slideIn .3s ease;}
  @keyframes pulseDot{0%,100%{opacity:1;} 50%{opacity:.4;}}
  .live-dot{width:8px; height:8px; border-radius:50%; background:var(--red); animation:pulseDot 1.2s infinite; box-shadow:0 0 8px var(--red);}
  .msg-bubble{padding:10px 14px; border-radius:16px; max-width:78%; font-size:13px; line-height:1.5; word-wrap:break-word;}
  .msg-admin{background:linear-gradient(135deg, rgba(0,229,255,.25), rgba(168,85,247,.25)); border:1px solid rgba(0,229,255,.35); border-bottom-left-radius:4px; align-self:flex-start;}
  .msg-user{background:linear-gradient(135deg, rgba(34,255,136,.25), rgba(0,229,255,.15)); border:1px solid rgba(34,255,136,.35); border-bottom-right-radius:4px; align-self:flex-end;}
  .msg-time{font-size:10px; color:#8ea0cc; margin-top:4px;}
  .unread-dot{width:8px; height:8px; background:var(--cyan); border-radius:50%; box-shadow:0 0 8px var(--cyan);}
</style>
</head>
<body class="pb-24">

<!-- ================= LOGIN / SIGNUP ================= -->
<div id="authScreen" class="min-h-screen flex items-center justify-center p-5">
  <div class="glass card p-6 w-full max-w-md glow-cyan">
    <div class="text-center mb-6">
      <div class="inline-block px-4 py-2 rounded-2xl bg-gradient-to-r from-cyan-500 to-purple-500 mb-3">
        <h1 class="text-2xl font-game text-black">E-SPORTS BD</h1>
      </div>
      <p class="text-xs text-cyan-300 tracking-widest">PLAY • COMPETE • WIN</p>
    </div>

    <div class="flex gap-2 mb-5">
      <button onclick="switchAuth('login')" id="tabLogin" class="btn tab-active flex-1 py-2 text-sm">LOGIN</button>
      <button onclick="switchAuth('signup')" id="tabSignup" class="btn flex-1 py-2 text-sm glass">SIGN UP</button>
    </div>

    <div id="loginForm" class="space-y-3">
      <input id="loginEmail" class="input" placeholder="Email or Phone"/>
      <input id="loginPass" type="password" class="input" placeholder="Password"/>
      <button onclick="doLogin()" class="btn w-full py-3 bg-gradient-to-r from-cyan-500 to-purple-500 text-black glow-cyan">LOGIN</button>
      <button onclick="resetPassword()" class="text-xs text-cyan-300 w-full text-center">Forgot Password?</button>
    </div>

    <div id="signupForm" class="space-y-3 hidden">
      <input id="suUser" class="input" placeholder="Username"/>
      <input id="suEmail" class="input" placeholder="Email"/>
      <input id="suPhone" class="input" placeholder="Phone (01XXXXXXXXX)"/>
      <input id="suFFUID" class="input" placeholder="Free Fire UID"/>
      <input id="suFFIGN" class="input" placeholder="Free Fire IGN"/>
      <input id="suPass" type="password" class="input" placeholder="Password (min 6)"/>
      <button onclick="doSignup()" class="btn w-full py-3 bg-gradient-to-r from-yellow-400 to-cyan-400 text-black glow-yellow">CREATE ACCOUNT</button>
    </div>

    <p class="text-[10px] text-center text-slate-400 mt-5 leading-relaxed">
      By continuing you agree to our Terms &amp; Privacy Policy.<br/>
      Not affiliated with Garena / Free Fire.
    </p>
  </div>
</div>

<!-- ================= MAIN APP ================= -->
<div id="app" class="hidden">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 glass border-b border-cyan-500/20">
    <div class="flex items-center justify-between px-4 py-3">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-400 to-purple-500 flex items-center justify-center font-game text-black text-xs">ES</div>
        <div>
          <div class="font-game text-sm leading-none">E-SPORTS BD</div>
          <div class="text-[9px] text-cyan-300 tracking-widest">PLAYER</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="go('wallet')" class="chip bg-yellow-400/15 text-yellow-300 border border-yellow-400/30">
          ৳ <span id="hdrBal">0</span>
        </button>
        <button onclick="go('messages')" class="relative p-2 rounded-lg glass">
          <svg class="w-5 h-5 text-cyan-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
          <span id="msgBadge" class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-[9px] flex items-center justify-center hidden">0</span>
        </button>
        <button onclick="go('notifications')" class="relative p-2 rounded-lg glass">
          <svg class="w-5 h-5 text-cyan-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span id="notifBadge" class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-[9px] flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- PAGES -->
  <main id="main" class="px-4 pt-4 max-w-lg mx-auto"></main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a onclick="go('home')" data-nav="home">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
      <span>Home</span>
    </a>
    <a onclick="go('tournaments')" data-nav="tournaments">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M12 3l8 4v6c0 5-3.5 7.5-8 8-4.5-.5-8-3-8-8V7l8-4z"/></svg>
      <span>Matches</span>
    </a>
    <a onclick="go('results')" data-nav="results">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm12-3c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z"/></svg>
      <span>Results</span>
    </a>
    <a onclick="go('wallet')" data-nav="wallet">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7zm0 0V5a2 2 0 012-2h10m-3 8h.01"/></svg>
      <span>Wallet</span>
    </a>
    <a onclick="go('profile')" data-nav="profile">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span>Profile</span>
    </a>
  </nav>
</div>

<script>
/* ============================================================
   E-SPORTS BD — USER PANEL (demo, localStorage)
   Includes: Messages feature (admin ⇄ user)
   ============================================================ */

const DB_KEY = 'esbd_db';
const SESSION_KEY = 'esbd_user';

const $ = id => document.getElementById(id);
const uid = () => 'id_' + Math.random().toString(36).slice(2, 10);
const fmt = n => Number(n||0).toLocaleString('en-BD');
const bdt = n => '৳' + fmt(n);
const shortTime = iso => new Date(iso).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const escapeHtml = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function defaultDB(){
  return {
    users: [],
    gameModes: [
      {id:'br',      name:'BR Match',      active:true, icon:'🎯'},
      {id:'duo',     name:'Duo BR Match',  active:true, icon:'👥'},
      {id:'pro',     name:'Pro League',    active:true, icon:'🏆'},
      {id:'surv',    name:'Survival',      active:true, icon:'🛡️'},
      {id:'cs4',     name:'CS 4 VS 4',     active:true, icon:'⚔️'},
      {id:'clash',   name:'Clash Squad',   active:true, icon:'💥'},
      {id:'head',    name:'Headshot Match',active:true, icon:'🎯'},
      {id:'custom',  name:'Custom Match',  active:true, icon:'🎮'},
    ],
    tournaments: [],
    transactions: [],
    notifications: [],
    banners: [],
    results: [],
    messages: [],   // {id, from:'admin'|'user'|userId, to:'admin'|userId, userId, text, at, read:false}
    auditLogs: [],
    settings: { minDeposit:50, minWithdraw:100 }
  };
}
function loadDB(){
  let d = localStorage.getItem(DB_KEY);
  if(!d){ d = JSON.stringify(defaultDB()); localStorage.setItem(DB_KEY, d); }
  const parsed = JSON.parse(d);
  if(!parsed.messages) parsed.messages = [];
  if(!parsed.auditLogs) parsed.auditLogs = [];
  return parsed;
}
function saveDB(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }

function currentUser(){
  const s = localStorage.getItem(SESSION_KEY);
  if(!s) return null;
  return loadDB().users.find(u => u.id === s) || null;
}
function refreshHeader(){
  const u = currentUser();
  if(!u) return;
  $('hdrBal').textContent = fmt((u.wallet.available||0) + (u.wallet.winning||0));
  const db = loadDB();
  const unread = db.notifications.filter(n =>
    (n.target==='all' || n.target===u.id) && !(n.readBy||[]).includes(u.id)
  ).length;
  $('notifBadge').textContent = unread;
  $('notifBadge').style.display = unread ? 'flex' : 'none';

  // Messages unread badge
  const unreadMsgs = db.messages.filter(m => m.userId===u.id && m.from==='admin' && !m.read).length;
  const mb = $('msgBadge');
  if(mb){
    mb.textContent = unreadMsgs;
    mb.style.display = unreadMsgs ? 'flex' : 'none';
  }
}

/* ---------- Auth ---------- */
function switchAuth(which){
  if(which==='login'){
    $('tabLogin').classList.add('tab-active');
    $('tabSignup').classList.remove('tab-active');
    $('loginForm').classList.remove('hidden');
    $('signupForm').classList.add('hidden');
  }else{
    $('tabSignup').classList.add('tab-active');
    $('tabLogin').classList.remove('tab-active');
    $('signupForm').classList.remove('hidden');
    $('loginForm').classList.add('hidden');
  }
}
function doSignup(){
  const username = $('suUser').value.trim();
  const email = $('suEmail').value.trim();
  const phone = $('suPhone').value.trim();
  const ffUid = $('suFFUID').value.trim();
  const ffIgn = $('suFFIGN').value.trim();
  const pass = $('suPass').value;
  if(!username || !email || !phone || !ffUid || !ffIgn || !pass)
    return Swal.fire({icon:'warning',title:'সব ঘর পূরণ করুন',background:'#0d1330',color:'#fff'});
  if(pass.length < 6)
    return Swal.fire({icon:'warning',title:'Password min 6 chars',background:'#0d1330',color:'#fff'});
  if(!/^01\d{9}$/.test(phone))
    return Swal.fire({icon:'warning',title:'সঠিক বাংলাদেশি নাম্বার দিন',background:'#0d1330',color:'#fff'});

  const db = loadDB();
  if(db.users.some(u => u.email===email || u.phone===phone))
    return Swal.fire({icon:'error',title:'Email/Phone already registered',background:'#0d1330',color:'#fff'});

  const u = {
    id: uid(),
    userCode: 'ESBD' + Math.floor(100000 + Math.random()*900000),
    username, email, phone, ffUid, ffIgn,
    password: pass,
    avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(username)}`,
    wallet: { available: 0, winning: 0 },
    stats: { matches:0, wins:0 },
    joinedAt: new Date().toISOString(),
    blocked: false
  };
  db.users.push(u);
  db.notifications.push({
    id: uid(), title:'Welcome to E-SPORTS BD 🎮',
    body:'আপনার অ্যাকাউন্ট তৈরি হয়েছে। এখন টুর্নামেন্টে যোগ দিন!',
    at: new Date().toISOString(), target: u.id, readBy:[]
  });
  // Welcome message from admin
  db.messages.push({
    id: uid(), from:'admin', to: u.id, userId: u.id,
    text: `স্বাগতম ${username}! 🎮\n\nE-SPORTS BD-তে আপনাকে স্বাগতম। যেকোনো সমস্যায় এখানে message করুন।`,
    at: new Date().toISOString(), read: false
  });
  saveDB(db);
  Swal.fire({icon:'success',title:'Account Created!',text:'এখন লগইন করুন',background:'#0d1330',color:'#fff'})
    .then(()=>switchAuth('login'));
}
function doLogin(){
  const id = $('loginEmail').value.trim();
  const pass = $('loginPass').value;
  if(!id || !pass) return Swal.fire({icon:'warning',title:'সব ঘর পূরণ করুন',background:'#0d1330',color:'#fff'});
  const db = loadDB();
  const u = db.users.find(x => (x.email===id || x.phone===id) && x.password===pass);
  if(!u) return Swal.fire({icon:'error',title:'ভুল তথ্য',background:'#0d1330',color:'#fff'});
  if(u.blocked) return Swal.fire({icon:'error',title:'Account blocked',background:'#0d1330',color:'#fff'});
  localStorage.setItem(SESSION_KEY, u.id);
  enterApp();
}
function resetPassword(){
  Swal.fire({
    title:'Reset Password',
    input:'email', inputPlaceholder:'Your email',
    background:'#0d1330', color:'#fff', showCancelButton:true,
    confirmButtonColor:'#00e5ff'
  }).then(r => {
    if(r.isConfirmed && r.value){
      Swal.fire({icon:'success',title:'Reset link sent',text:'(Demo — check console)',background:'#0d1330',color:'#fff'});
      console.log('Reset link for', r.value);
    }
  });
}
function logout(){
  localStorage.removeItem(SESSION_KEY);
  $('app').classList.add('hidden');
  $('authScreen').classList.remove('hidden');
}
function enterApp(){
  $('authScreen').classList.add('hidden');
  $('app').classList.remove('hidden');
  refreshHeader();
  go('home');
}

/* ---------- Router ---------- */
let currentRoute = 'home';
function go(route){
  currentRoute = route;
  document.querySelectorAll('.bottom-nav a').forEach(a=>{
    a.classList.toggle('active', a.dataset.nav===route);
  });
  const main = $('main');
  main.innerHTML = '';
  ({home:renderHome, tournaments:renderTournaments, results:renderResults,
    wallet:renderWallet, profile:renderProfile, notifications:renderNotifications,
    messages:renderMessages
  }[route] || renderHome)();
  refreshHeader();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- HOME ---------- */
function renderHome(){
  const db = loadDB();
  const u = currentUser();
  const activeBanners = db.banners.filter(b => b.active !== false);
  const featured = db.tournaments.filter(t => t.status==='upcoming').slice(0,3);
  const upcoming = db.tournaments.filter(t => t.status==='upcoming').slice(0,5);
  const recent = db.results.slice(-3).reverse();
  const activeModes = db.gameModes.filter(m => m.active);

  $('main').innerHTML = `
    <div class="page space-y-5">
      <div class="flex items-center justify-between">
        <div>
          <div class="text-xs text-slate-400">স্বাগতম,</div>
          <div class="font-game text-lg text-cyan-300 neon-text">${escapeHtml(u.username)}</div>
        </div>
        <div class="chip bg-purple-500/15 text-purple-300 border border-purple-400/30">
          ID: ${u.userCode}
        </div>
      </div>

      <div class="scroll-x snap-x snap-mandatory -mx-4 px-4">
        ${(activeBanners.length ? activeBanners : [{
          title:'🔥 Pro League Season 5', subtitle:'৳50,000 Prize Pool', btn:'Join Now', action:'tournaments'
        },{
          title:'🎯 Headshot Match Special', subtitle:'Per Kill ৳30', btn:'Explore', action:'tournaments'
        }]).map(b => `
          <div class="snap-center shrink-0 w-[85vw] max-w-md card p-4 relative overflow-hidden glass glow-purple"
               style="background:linear-gradient(135deg, rgba(168,85,247,.35), rgba(0,229,255,.2));">
            <div class="relative z-10">
              <div class="text-[10px] tracking-widest text-yellow-300">FEATURED</div>
              <div class="font-game text-xl mt-1">${escapeHtml(b.title)}</div>
              <div class="text-xs text-slate-200 mt-1">${escapeHtml(b.subtitle||'')}</div>
              <button onclick="go('${b.action||'tournaments'}')" class="btn mt-3 px-4 py-1.5 text-xs bg-yellow-400 text-black glow-yellow">${escapeHtml(b.btn||'View')}</button>
            </div>
            <div class="absolute -right-6 -bottom-8 w-32 h-32 rounded-full bg-cyan-400/20 blur-2xl"></div>
          </div>
        `).join('')}
      </div>

      <section>
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-game text-sm text-cyan-300 neon-text">🎮 GAME MODES</h3>
          <button onclick="go('tournaments')" class="text-[11px] text-slate-400">View all →</button>
        </div>
        <div class="grid grid-cols-4 gap-2">
          ${activeModes.slice(0,8).map(m => `
            <div onclick="go('tournaments')" class="glass card p-2 text-center active:scale-95 transition cursor-pointer">
              <div class="text-xl">${m.icon}</div>
              <div class="text-[10px] mt-1 leading-tight text-slate-200">${escapeHtml(m.name)}</div>
            </div>
          `).join('')}
        </div>
      </section>

      <section>
        <h3 class="font-game text-sm text-cyan-300 neon-text mb-3">🔥 FEATURED</h3>
        ${featured.length ? featured.map(t => tournamentCard(t, true)).join('') : emptyCard('Featured tournament নেই')}
      </section>

      <section>
        <h3 class="font-game text-sm text-yellow-300 neon-text mb-3">📅 UPCOMING</h3>
        ${upcoming.length ? upcoming.map(t => tournamentCard(t)).join('') : emptyCard('Upcoming tournament নেই'
