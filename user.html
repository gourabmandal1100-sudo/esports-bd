<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>E-SPORTS BD — Player</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{--navy:#070b1c;--cyan:#00e5ff;--yellow:#ffd60a;--purple:#a855f7;--green:#22ff88;--red:#ff3b5c;}
  *{font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
  h1,h2,h3,.font-game{font-family:'Orbitron',sans-serif;letter-spacing:.5px;}
  body{background:radial-gradient(1200px 600px at 10% -10%, rgba(168,85,247,.18), transparent 60%),radial-gradient(900px 500px at 110% 10%, rgba(0,229,255,.15), transparent 60%),var(--navy);color:#e7ecff;min-height:100vh;overflow-x:hidden;}
  .glass{background:rgba(20,28,60,.55);backdrop-filter:blur(14px);border:1px solid rgba(120,160,255,.15);}
  .glow-cyan{box-shadow:0 0 20px rgba(0,229,255,.35), inset 0 0 12px rgba(0,229,255,.08);}
  .glow-yellow{box-shadow:0 0 18px rgba(255,214,10,.35);}
  .glow-purple{box-shadow:0 0 20px rgba(168,85,247,.35);}
  .glow-green{box-shadow:0 0 18px rgba(34,255,136,.35);}
  .neon-text{text-shadow:0 0 8px currentColor, 0 0 18px currentColor;}
  .card{border-radius:18px;}
  .btn{border-radius:12px; font-weight:700; transition:.2s;}
  .btn:active{transform:scale(.97);}
  .input{background:rgba(255,255,255,.05); border:1px solid rgba(120,160,255,.2); border-radius:12px; padding:12px 14px; width:100%; color:#fff; outline:none;}
  .input:focus{border-color:var(--cyan); box-shadow:0 0 0 3px rgba(0,229,255,.15);}
  .chip{display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:600;}
  .tab-active{background:linear-gradient(90deg,var(--cyan),var(--purple)); color:#000; box-shadow:0 0 16px rgba(0,229,255,.5);}
  .bottom-nav{position:fixed; bottom:0; left:0; right:0; z-index:40; backdrop-filter:blur(20px); background:rgba(7,11,28,.9); border-top:1px solid rgba(120,160,255,.15); display:flex;}
  .bottom-nav a{flex:1; display:flex; flex-direction:column; align-items:center; padding:10px 0; font-size:10px; color:#8ea0cc; transition:.2s; cursor:pointer;}
  .bottom-nav a.active{color:var(--cyan); text-shadow:0 0 10px var(--cyan);}
  .bottom-nav a svg{width:22px; height:22px; margin-bottom:2px;}
  .scroll-x{display:flex; overflow-x:auto; gap:10px; scrollbar-width:none;}
  .scroll-x::-webkit-scrollbar{display:none;}
  @keyframes slideIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  .page{animation:slideIn .3s ease;}
  @keyframes pulseDot{0%,100%{opacity:1;} 50%{opacity:.4;}}
  .live-dot{width:8px; height:8px; border-radius:50%; background:var(--red); animation:pulseDot 1.2s infinite; box-shadow:0 0 8px var(--red);}
  .msg-bubble{padding:10px 14px; border-radius:16px; max-width:78%; font-size:13px; line-height:1.5; word-wrap:break-word; white-space:pre-wrap;}
  .msg-admin{background:linear-gradient(135deg, rgba(0,229,255,.25), rgba(168,85,247,.25)); border:1px solid rgba(0,229,255,.35); border-bottom-left-radius:4px; align-self:flex-start;}
  .msg-user{background:linear-gradient(135deg, rgba(34,255,136,.25), rgba(0,229,255,.15)); border:1px solid rgba(34,255,136,.35); border-bottom-right-radius:4px; align-self:flex-end;}
  .msg-time{font-size:10px; color:#8ea0cc; margin-top:4px;}
  .room-box{background:linear-gradient(135deg, rgba(0,229,255,.15), rgba(168,85,247,.1)); border:1px solid rgba(0,229,255,.4); border-radius:14px; padding:12px;}
  .room-code{font-family:'Courier New',monospace; font-weight:700; color:var(--cyan); letter-spacing:1px; font-size:16px;}
</style>
</head>
<body class="pb-24">

<div id="authScreen" class="min-h-screen flex items-center justify-center p-5">
  <div class="glass card p-6 w-full max-w-md glow-cyan">
    <div class="text-center mb-6">
      <div class="inline-block px-4 py-2 rounded-2xl bg-gradient-to-r from-cyan-500 to-purple-500 mb-3">
        <h1 class="text-2xl font-game text-black">E-SPORTS BD</h1>
      </div>
      <p class="text-xs text-cyan-300 tracking-widest">PLAY • COMPETE • WIN</p>
    </div>

    <div class="flex gap-2 mb-5">
      <button onclick="switchAuth('login')" id="tabLogin" class="btn tab-active flex-1 py-2 text-sm">LOGIN</button>
      <button onclick="switchAuth('signup')" id="tabSignup" class="btn flex-1 py-2 text-sm glass">SIGN UP</button>
    </div>

    <div id="loginForm" class="space-y-3">
      <input id="loginEmail" class="input" placeholder="Email"/>
      <input id="loginPass" type="password" class="input" placeholder="Password"/>
      <button id="loginBtn" onclick="doLogin()" class="btn w-full py-3 bg-gradient-to-r from-cyan-500 to-purple-500 text-black glow-cyan">LOGIN</button>
      <button onclick="resetPassword()" class="text-xs text-cyan-300 w-full text-center">Forgot Password?</button>
    </div>

    <div id="signupForm" class="space-y-3 hidden">
      <input id="suUser" class="input" placeholder="Username"/>
      <input id="suEmail" class="input" placeholder="Email" type="email"/>
      <input id="suPhone" class="input" placeholder="Phone (01XXXXXXXXX)" type="tel"/>
      <input id="suFFUID" class="input" placeholder="Free Fire UID"/>
      <input id="suFFIGN" class="input" placeholder="Free Fire IGN"/>
      <input id="suPass" type="password" class="input" placeholder="Password (min 6)"/>
      <button id="signupBtn" onclick="doSignup()" class="btn w-full py-3 bg-gradient-to-r from-yellow-400 to-cyan-400 text-black glow-yellow">CREATE ACCOUNT</button>
    </div>

    <p class="text-[10px] text-center text-slate-400 mt-5 leading-relaxed">
      By continuing you agree to our Terms &amp; Privacy Policy.<br/>
      Not affiliated with Garena / Free Fire.
    </p>
  </div>
</div>

<div id="app" class="hidden">
    <header class="sticky top-0 z-30 glass border-b border-cyan-500/20">
    <div class="flex items-center justify-between px-4 py-3">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-400 to-purple-500 flex items-center justify-center font-game text-black text-xs">ES</div>
        <div>
          <div class="font-game text-sm leading-none">E-SPORTS BD</div>
          <div class="text-[9px] text-cyan-300 tracking-widest">PLAYER</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="go('wallet')" class="chip bg-yellow-400/15 text-yellow-300 border border-yellow-400/30">
          ৳ <span id="hdrBal">0</span>
        </button>
        <button onclick="go('messages')" class="relative p-2 rounded-lg glass">
          <svg class="w-5 h-5 text-cyan-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
          <span id="msgBadge" class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-[9px] flex items-center justify-center hidden">0</span>
        </button>
        <button onclick="go('notifications')" class="relative p-2 rounded-lg glass">
          <svg class="w-5 h-5 text-cyan-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span id="notifBadge" class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-[9px] flex items-center justify-center hidden">0</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="px-4 pt-4 max-w-lg mx-auto"></main>

  <nav class="bottom-nav">
    <a onclick="go('home')" data-nav="home">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
      <span>Home</span>
    </a>
    <a onclick="go('tournaments')" data-nav="tournaments">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M12 3l8 4v6c0 5-3.5 7.5-8 8-4.5-.5-8-3-8-8V7l8-4z"/></svg>
      <span>Matches</span>
    </a>
    <a onclick="go('results')" data-nav="results">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm12-3c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z"/></svg>
      <span>Results</span>
    </a>
    <a onclick="go('wallet')" data-nav="wallet">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7zm0 0V5a2 2 0 012-2h10m-3 8h.01"/></svg>
      <span>Wallet</span>
    </a>
    <a onclick="go('profile')" data-nav="profile">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span>Profile</span>
    </a>
  </nav>
</div>

<script type="module">
/* ============================================================
   E-SPORTS BD — PLAYER APP (Firebase Version)
   ============================================================ */

import {
  auth, db,
  signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signOut, onAuthStateChanged, sendPasswordResetEmail,
  doc, getDoc, setDoc, collection, getDocs, query, where, orderBy,
  limit, onSnapshot, addDoc, updateDoc, deleteDoc,
  serverTimestamp, increment, runTransaction,
  fmt, bdt, escapeHtml, shortTime
} from './firebase-config.js';

// ==================== GLOBAL STATE ====================
let currentUser = null;
let currentUserData = null;
let currentRoute = 'home';
let tournamentsCache = [];
let bannersCache = [];
let gameModesCache = [];
let notificationsCache = [];
let resultsCache = [];
let messagesCache = [];
let transactionsCache = [];
let unsubscribers = [];
window._tourFilter = 'all';
window._tourModeFilter = null;

const $ = id => document.getElementById(id);

// ==================== AUTH: SWITCH TAB ====================
window.switchAuth = function(which){
  if(which === 'login'){
    $('tabLogin').classList.add('tab-active');
    $('tabSignup').classList.remove('tab-active');
    $('loginForm').classList.remove('hidden');
    $('signupForm').classList.add('hidden');
  } else {
    $('tabSignup').classList.add('tab-active');
    $('tabLogin').classList.remove('tab-active');
    $('signupForm').classList.remove('hidden');
    $('loginForm').classList.add('hidden');
  }
};
  // ==================== SIGNUP ====================
window.doSignup = async function(){
  const username = $('suUser').value.trim();
  const email = $('suEmail').value.trim();
  const phone = $('suPhone').value.trim();
  const ffUid = $('suFFUID').value.trim();
  const ffIgn = $('suFFIGN').value.trim();
  const pass = $('suPass').value;
  const btn = $('signupBtn');

  if(!username || !email || !phone || !ffUid || !ffIgn || !pass){
    Swal.fire({icon:'warning', title:'সব ঘর পূরণ করুন', background:'#0d1330', color:'#fff'});
    return;
  }
  if(pass.length < 6){
    Swal.fire({icon:'warning', title:'Password min 6 chars', background:'#0d1330', color:'#fff'});
    return;
  }
  if(!/^01\d{9}$/.test(phone)){
    Swal.fire({icon:'warning', title:'সঠিক বাংলাদেশি নাম্বার দিন', background:'#0d1330', color:'#fff'});
    return;
  }

  btn.disabled = true;
  btn.textContent = 'CREATING...';

  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    const uid = cred.user.uid;

    await setDoc(doc(db, 'users', uid), {
      userCode: 'ESBD' + Math.floor(100000 + Math.random() * 900000),
      username, email, phone, ffUid, ffIgn,
      avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(username)}`,
      wallet: { available: 0, winning: 0 },
      stats: { matches: 0, wins: 0 },
      role: 'user',
      blocked: false,
      joinedAt: serverTimestamp()
    });

    await addDoc(collection(db, 'notifications'), {
      title: 'Welcome to E-SPORTS BD 🎮',
      body: `স্বাগতম ${username}! এখন টুর্নামেন্টে যোগ দিন।`,
      at: serverTimestamp(), target: uid, readBy: []
    });

    await addDoc(collection(db, 'messages'), {
      userId: uid, from: 'admin', to: uid,
      text: `স্বাগতম ${username}! 🎮\n\nযেকোনো সমস্যায় এখানে message করুন।`,
      at: serverTimestamp(), read: false
    });

    Swal.fire({icon:'success', title:'Account Created!', background:'#0d1330', color:'#fff'});
  } catch(e) {
    console.error('Signup error:', e);
    let msg = e.message || 'Signup failed';
    if(e.code === 'auth/email-already-in-use') msg = 'এই email আগেই ব্যবহৃত';
    if(e.code === 'auth/invalid-email') msg = 'ভুল email';
    if(e.code === 'auth/weak-password') msg = 'দুর্বল password';
    Swal.fire({icon:'error', title: msg, background:'#0d1330', color:'#fff'});
  } finally {
    btn.disabled = false;
    btn.textContent = 'CREATE ACCOUNT';
  }
};

// ==================== LOGIN ====================
window.doLogin = async function(){
  const email = $('loginEmail').value.trim();
  const pass = $('loginPass').value;
  const btn = $('loginBtn');

  if(!email || !pass){
    Swal.fire({icon:'warning', title:'সব ঘর পূরণ করুন', background:'#0d1330', color:'#fff'});
    return;
  }

  btn.disabled = true;
  btn.textContent = 'LOGGING IN...';

  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    console.error('Login error:', e);
    let msg = 'Login failed';
    if(e.code === 'auth/invalid-credential') msg = 'ভুল email বা password';
    if(e.code === 'auth/user-not-found') msg = 'এই email-এ কোনো account নেই';
    if(e.code === 'auth/wrong-password') msg = 'ভুল password';
    Swal.fire({icon:'error', title: msg, background:'#0d1330', color:'#fff'});
    btn.disabled = false;
    btn.textContent = 'LOGIN';
  }
};

// ==================== RESET PASSWORD ====================
window.resetPassword = function(){
  Swal.fire({
    title: 'Reset Password',
    input: 'email',
    inputPlaceholder: 'Your email',
    background: '#0d1330', color: '#fff',
    showCancelButton: true,
    confirmButtonColor: '#00e5ff'
  }).then(async (r) => {
    if(r.isConfirmed && r.value){
      try {
        await sendPasswordResetEmail(auth, r.value);
        Swal.fire({icon:'success', title:'Reset link sent', text:'আপনার email check করুন', background:'#0d1330', color:'#fff'});
      } catch(e){
        Swal.fire({icon:'error', title:e.message, background:'#0d1330', color:'#fff'});
      }
    }
  });
};

// ==================== AUTH STATE ====================
onAuthStateChanged(auth, async (user) => {
  if(user){
    try {
      const snap = await getDoc(doc(db, 'users', user.uid));
      if(!snap.exists()){
        await signOut(auth);
        Swal.fire({icon:'error', title:'User record not found', background:'#0d1330', color:'#fff'});
        return;
      }
      const data = snap.data();
      if(data.blocked === true){
        await signOut(auth);
        Swal.fire({icon:'error', title:'Account blocked', text:'Admin এর সাথে যোগাযোগ করুন', background:'#0d1330', color:'#fff'});
        return;
      }

      // Block admin from user app
      if(data.role === 'admin'){
        await signOut(auth);
        Swal.fire({icon:'info', title:'Admin account', text:'Admin panel ব্যবহার করুন: /admin.html', background:'#0d1330', color:'#fff'});
        return;
      }

      currentUser = user;
      currentUserData = { id: user.uid, ...data };
      $('authScreen').classList.add('hidden');
      $('app').classList.remove('hidden');
      startRealtimeListeners(user.uid);
      go('home');
    } catch(e){
      console.error('Auth state error:', e);
      await signOut(auth);
    }
  } else {
    currentUser = null;
    currentUserData = null;
    stopRealtimeListeners();
    $('app').classList.add('hidden');
    $('authScreen').classList.remove('hidden');
    $('loginBtn').disabled = false;
    $('loginBtn').textContent = 'LOGIN';
    $('signupBtn').disabled = false;
    $('signupBtn').textContent = 'CREATE ACCOUNT';
  }
});

// ==================== LOGOUT ====================
window.logout = async function(){
  const r = await Swal.fire({
    title: 'Logout?', icon: 'question',
    showCancelButton: true,
    background: '#0d1330', color: '#fff',
    confirmButtonColor: '#ff3b5c'
  });
  if(r.isConfirmed){
    stopRealtimeListeners();
    await signOut(auth);
  }
};

// ==================== REALTIME LISTENERS ====================
function startRealtimeListeners(uid){
  stopRealtimeListeners();

  unsubscribers.push(
    onSnapshot(doc(db, 'users', uid), (snap) => {
      if(snap.exists()){
        currentUserData = { id: snap.id, ...snap.data() };
        refreshHeader();
        if(currentRoute === 'profile') renderProfile();
        if(currentRoute === 'wallet') renderWallet();
      }
    }, err => console.error('profile listener:', err))
  );

  unsubscribers.push(
    onSnapshot(collection(db, 'tournaments'), (snap) => {
      tournamentsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if(currentRoute === 'home') renderHome();
      if(currentRoute === 'tournaments') renderTournaments();
    }, err => console.error('tournaments listener:', err))
  );

  unsubscribers.push(
    onSnapshot(collection(db, 'banners'), (snap) => {
      bannersCache = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(b => b.active !== false);
      if(currentRoute === 'home') renderHome();
    }, err => console.error('banners listener:', err))
  );

  unsubscribers.push(
    onSnapshot(collection(db, 'gameModes'), (snap) => {
      gameModesCache = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(m => m.active !== false);
      if(currentRoute === 'home') renderHome();
    }, err => console.error('gameModes listener:', err))
  );

  const notifQ = query(collection(db, 'notifications'), orderBy('at', 'desc'), limit(50));
  unsubscribers.push(
    onSnapshot(notifQ, (snap) => {
      notificationsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      refreshHeader();
      if(currentRoute === 'notifications') renderNotifications();
    }, err => console.error('notifications listener:', err))
  );

  const resQ = query(collection(db, 'results'), orderBy('at', 'desc'), limit(30));
  unsubscribers.push(
    onSnapshot(resQ, (snap) => {
      resultsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if(currentRoute === 'results') renderResults();
    }, err => console.error('results listener:', err))
  );

  const msgQ = query(
    collection(db, 'messages'),
    where('userId', '==', uid),
    orderBy('at', 'asc')
  );
  unsubscribers.push(
    onSnapshot(msgQ, (snap) => {
      messagesCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      refreshHeader();
      if(currentRoute === 'messages') renderMessages();
    }, err => console.error('messages listener:', err))
  );

  const txQ = query(
    collection(db, 'transactions'),
    where('userId', '==', uid),
    orderBy('at', 'desc'),
    limit(50)
  );
  unsubscribers.push(
    onSnapshot(txQ, (snap) => {
      transactionsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if(currentRoute === 'wallet') renderWallet();
    }, err => console.error('transactions listener:', err))
  );
}

function stopRealtimeListeners(){
  unsubscribers.forEach(u => { try { u(); } catch(e){} });
  unsubscribers = [];
}

// ==================== ROUTER ====================
window.go = function(route){
  currentRoute = route;
  document.querySelectorAll('.bottom-nav a').forEach(a=>{
    a.classList.toggle('active', a.dataset.nav === route);
  });
  const main = $('main');
  main.innerHTML = '';
  const map = {
    home: renderHome,
    tournaments: renderTournaments,
    results: renderResults,
    wallet: renderWallet,
    profile: renderProfile,
    notifications: renderNotifications,
    messages: renderMessages
  };
  (map[route] || renderHome)();
  refreshHeader();
  window.scrollTo({top:0, behavior:'smooth'});
};

// ==================== MODE FILTER NAVIGATION ====================
window.goModeMatches = function(mode){
  window._tourModeFilter = mode;
  window._tourFilter = 'all';
  go('tournaments');
};

// ==================== HEADER REFRESH ====================
function refreshHeader(){
  if(!currentUserData) return;
  const bal = (currentUserData.wallet?.available || 0) + (currentUserData.wallet?.winning || 0);
  $('hdrBal').textContent = fmt(bal);

  const unreadNotifs = notificationsCache.filter(n =>
    (n.target === 'all' || n.target === currentUser?.uid) &&
    !(n.readBy || []).includes(currentUser?.uid)
  ).length;
  const notifBadge = $('notifBadge');
  if(notifBadge){
    if(unreadNotifs > 0){ notifBadge.textContent = unreadNotifs; notifBadge.classList.remove('hidden'); }
    else notifBadge.classList.add('hidden');
  }

  const unreadMsgs = messagesCache.filter(m => m.from === 'admin' && !m.read).length;
  const msgBadge = $('msgBadge');

window.joinTournament = async function(tid){
  const t = tournamentsCache.find(x => x.id === tid);
  if(!t) return;
  if((t.players || []).includes(currentUser.uid)){
    Swal.fire({icon:'info', title:'Already joined', background:'#0d1330', color:'#fff'});
    return;
  }
  const bal = (currentUserData?.wallet?.available || 0);
  const fee = t.entryFee || 0;
  if(bal < fee){
    Swal.fire({
      icon: 'warning',
      title: 'পর্যাপ্ত balance নেই',
      text: `আপনার balance: ৳${fmt(bal)} • প্রয়োজন: ৳${fmt(fee)}`,
      background:'#0d1330', color:'#fff'
    });
    return;
  }

  const r = await Swal.fire({
    title: 'Join Tournament?',
    html: `<div style="text-align:left;font-size:13px;color:#cbd5ff">
      <div><b>${escapeHtml(t.title)}</b></div>
      <div style="margin-top:6px;">Entry Fee: <b>৳${fmt(fee)}</b></div>
      <div>Your Balance: <b>৳${fmt(bal)}</b></div>
      <div style="margin-top:6px;opacity:.7;">Join করলে balance থেকে ৳${fmt(fee)} কেটে নেওয়া হবে।</div>
    </div>`,
    icon: 'question',
    showCancelButton: true,
    background:'#0d1330', color:'#fff',
    confirmButtonColor: '#00e5ff'
  });
  if(!r.isConfirmed) return;

  try {
    await runTransaction(db, async (trx) => {
      const userRef = doc(db, 'users', currentUser.uid);
      const tourRef = doc(db, 'tournaments', tid);
      const uSnap = await trx.get(userRef);
      const tSnap = await trx.get(tourRef);
      if(!uSnap.exists() || !tSnap.exists()) throw new Error('Data not found');
      const uData = uSnap.data();
      const tData = tSnap.data();
      const uBal = uData.wallet?.available || 0;
      if(uBal < fee) throw new Error('Insufficient balance');
      const players = tData.players || [];
      if(players.includes(currentUser.uid)) throw new Error('Already joined');
      if(players.length >= (tData.slots?.total || 48)) throw new Error('Match is full');

      trx.update(userRef, { 'wallet.available': increment(-fee), 'stats.matches': increment(1) });
      trx.update(tourRef, {
        players: [...players, currentUser.uid],
        'slots.filled': players.length + 1
      });
      trx.set(doc(collection(db, 'transactions')), {
        userId: currentUser.uid,
        type: 'entry_fee',
        amount: -fee,
        tournamentId: tid,
        tournamentName: tData.title || '',
        status: 'completed',
        at: serverTimestamp()
      });
    });
    Swal.fire({icon:'success', title:'Joined! 🎮', text:'Room details এখানে দেখা যাবে', background:'#0d1330', color:'#fff', timer:1800, showConfirmButton:false});
  } catch(e){
    console.error('Join error:', e);
    Swal.fire({icon:'error', title:'Join failed', text:e.message, background:'#0d1330', color:'#fff'});
  }
};

          <div class="w-2 h-2 bg-green-400 rounded-full"></div>
          <div class="font-game text-sm text-cyan-300">SUPPORT CHAT</div>
        </div>

        <div id="chatThread" class="chat-thread mb-3" style="max-height:60vh">
          ${messagesCache.length ? messagesCache.map(m => chatBubble(m)).join('') : `
            <div class="text-slate-400 text-xs text-center py-6">
              Admin এর সাথে chat শুরু করুন 💬
            </div>
          `}
        </div>

        <div class="flex gap-2">
          <input id="userMsgInput" class="input flex-1" placeholder="Type message..." onkeydown="if(event.key==='Enter')sendUserMsg()"/>
          <button onclick="sendUserMsg()" class="btn px-4 py-2 bg-cyan-500 text-black">Send</button>
        </div>
      </div>
    </div>
  `;
  setTimeout(() => {
    const el = $('chatThread');
    if(el) el.scrollTop = el.scrollHeight;
  }, 100);
}

function chatBubble(m){
  const isAdmin = m.from === 'admin';
  return `
    <div style="align-self:${isAdmin ? 'flex-start' : 'flex-end'}; max-width:78%">
      <div class="msg-bubble ${isAdmin ? 'msg-admin' : 'msg-user'}">${escapeHtml(m.text || '')}</div>
      <div class="msg-time" style="text-align:${isAdmin ? 'left' : 'right'}">
        ${isAdmin ? 'Admin' : 'You'} • ${shortTime(m.at)}
      </div>
    </div>
  `;
}

window.sendUserMsg = async function(){
  const input = $('userMsgInput');
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  try {
    await addDoc(collection(db, 'messages'), {
      userId: currentUser.uid,
      from: 'user',
      to: 'admin',
      text,
      at: serverTimestamp(),
      read: false
    });
  } catch(e){
    console.error('send msg error:', e);
    Swal.fire({icon:'error', title:'Failed to send', background:'#0d1330', color:'#fff'});
  }
};

// ==================== NOTIFICATIONS ====================
function renderNotifications(){
  const myNotifs = notificationsCache.filter(n =>
    n.target === 'all' || n.target === currentUser?.uid
  );

  $('main').innerHTML = `
    <div class="page space-y-3">
      <h3 class="font-game text-sm text-cyan-300 neon-text">🔔 NOTIFICATIONS</h3>
      ${myNotifs.length ? myNotifs.map(n => notifRow(n)).join('') : emptyCard('কোনো notification নেই')}
    </div>
  `;

  setTimeout(async () => {
    const unread = myNotifs.filter(n => !(n.readBy || []).includes(currentUser.uid));
    for(const n of unread){
      try {
        await updateDoc(doc(db, 'notifications', n.id), {
          readBy: [...(n.readBy || []), currentUser.uid]
        });
      } catch(e){}
    }
  }, 500);
}

function notifRow(n){
  const isNew = !(n.readBy || []).includes(currentUser?.uid);
  return `
    <div class="glass card p-4 ${isNew ? 'border-l-4 border-l-cyan-400' : ''}">
      <div class="flex items-start gap-3">
        <div class="text-2xl">${isNew ? '🔵' : '📬'}</div>
        <div class="flex-1 min-w-0">
          <div class="font-semibold text-sm">${escapeHtml(n.title || '-')}</div>
          <div class="text-xs text-slate-300 mt-1">${escapeHtml(n.body || '-')}</div>
          <div class="text-[10px] text-slate-500 mt-2">${shortTime(n.at)}</div>
        </div>
      </div>
    </div>
  `;
}

  // ==================== HELPERS ====================
function updateMsgBadge(){
  if(!currentUser) return;
  const unread = messagesCache.filter(m => m.from === 'admin' && !m.read).length;
  const badge = $('msgBadge');
  if(badge){
    if(unread > 0){ badge.textContent = unread; badge.classList.remove('hidden'); }
    else badge.classList.add('hidden');
  }
}

function updateNotifBadge(){
  if(!currentUser) return;
  const unread = notificationsCache.filter(n =>
    (n.target === 'all' || n.target === currentUser.uid) &&
    !(n.readBy || []).includes(currentUser.uid)
  ).length;
  const badge = $('notifBadge');
  if(badge){
    if(unread > 0){ badge.textContent = unread; badge.classList.remove('hidden'); }
    else badge.classList.add('hidden');
  }
}

// ==================== AUTO REFRESH BADGES ====================
setInterval(() => {
  if(currentUser){
    updateMsgBadge();
    updateNotifBadge();
  }
}, 3000);

// ==================== APP INIT ====================
console.log('E-SPORTS BD Player App loaded');
</script>
